# app-cluster-api.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-api-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: capi-operator-system
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/cluster-api-operator
    # until capmox supports capi 1.13
    targetRevision: 0.28.0
    chart: cluster-api-operator
    helm:
      values: |
        core:
          cluster-api:
            enabled: true
            version: v1.12.11
            manager:
              featureGates:
                ClusterTopology: true
        bootstrap:
          kubeadm: 
            enabled: true
            version: v1.12.11
            manager:
              featureGates:
                ClusterTopology: true
        controlPlane: 
          kubeadm: 
            enabled: true
            version: v1.12.11
            manager:
              featureGates:
                ClusterTopology: true
        infrastructure: 
          proxmox:
            enabled: true
            version: v0.9.1
            manager:
              featureGates:
                ClusterTopology: true
            patches:
                - patch: |
                    - op: replace
                      path: /spec/template/spec/containers/0/image
                      value: docker.io/3deep5me/controller:0.9.1-1
                  target:
                    group: apps
                    version: v1
                    kind: Deployment
                    name: capmox-controller-manager
                    namespace: proxmox-infrastructure-system
        ipam:
          in-cluster:
            enabled: true
            version: v1.1.0
        addon:
          helm: 
            enabled: true
            version: v0.6.2
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    automated: 
      prune: true
      selfHeal: true
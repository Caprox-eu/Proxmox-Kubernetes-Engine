# configure controlPlaneEndpoint + ipv4Config
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  labels:
    # mandatory for functional cluster
    caprox.eu/cni: cilium # or "caprox.eu/cni: cilium-ipv6-dual-stack" if you have ipv6 in your network
    caprox.eu/ccm: "true"
    caprox.eu/inject-proxmox-credentials: "true"
    # optional
    caprox.eu/csi: "true"
    caprox.eu/service-lb: "true"
  name: manuels-k8s-cluster
  namespace: caprox-kubernetes-engine 
spec:
  topology:
    classRef: 
      name: proxmox-clusterclass-cilium-v0.1.0
      namespace: caprox-kubernetes-engine
    # immutable until this is merged:
    # https://github.com/ionos-cloud/cluster-api-provider-proxmox/pull/832
    version: 1.35.8
    controlPlane:
      replicas: 1
    workers:
      machineDeployments:
      - class: proxmox-worker
        name: proxmox-worker-pool
        replicas: 1
    variables:
    - name: cloneSpec
      value:
        # sshAuthorizedKeys: 
        # - "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC0Z7+6k"
        vmTemplate:
          templateTag: "v1-35-10"
        #vmIDRange:
        #  start: 200
        #  end: 300
        # immutable until this is merged:
        # https://github.com/ionos-cloud/cluster-api-provider-proxmox/pull/832
        network:
          bridge: vmbr0
        #Example if you want to modify the default network interface
        # vlan: 100 
        # model: virtio
        #Example if you want to modify node resources
        #machineSpec:
        #  controlPlane:
        #    numCores: 2
        #    numSockets: 1
        #    memoryMiB: 4096
        #  workerNode:
        #    numCores: 6
        #    numSockets: 1
        #    memoryMiB: 6144
        #    disks:
        #      bootVolume:
        #        disk: scsi0
        #        sizeGb: 80
    #- name: workerNodeConfig
    #  value: 
    #    postInitCommands:
    #    - 'touch /root/workerNodeConfig.txt'
    #- name: controlPlaneConfig
    #  value: 
    #    postInitCommands: 
    #    - 'touch /root/controlplaneNodeConfig.txt'
    #    oidc:
    #      issuerUrl: "https://login.microsoftonline.com/9c508e11-7562-4ea9-95e5-4c00aa6d1b13/v2.0"
    #      clientId: "960c6f04-4468-4dc9-962c-7d7fb3bcde83"
    #      usernameClaim: "email"
    #      groupsClaim: "groups"
    - name: controlPlaneEndpoint
      value:
        host: 192.168.178.150
    - name: ipv4Config
      value:
        addresses:
        - 192.168.178.151-192.168.178.159
        gateway: 192.168.178.1
        prefix: 24
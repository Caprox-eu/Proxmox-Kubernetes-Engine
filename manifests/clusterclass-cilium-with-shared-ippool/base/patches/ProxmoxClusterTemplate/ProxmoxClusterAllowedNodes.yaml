- op: add
  path: /spec/patches/-
  value:
    name: ProxmoxClusterTemplateAllowedNodes
    description: "Configure allowedNodes for ProxmoxClusterTemplate"
    enabledIf: '{{ if .allowedNodes }}true{{ end }}'
    definitions:
      - selector:
          apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
          kind: ProxmoxClusterTemplate
          matchResources:
            infrastructureCluster: true
        jsonPatches:
          - op: add
            path: /spec/template/spec/allowedNodes
            valueFrom:
              variable: allowedNodes
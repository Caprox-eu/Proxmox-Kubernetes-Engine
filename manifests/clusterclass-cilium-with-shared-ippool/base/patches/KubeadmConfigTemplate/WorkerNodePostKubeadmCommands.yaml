- op: add
  path: /spec/patches/-
  value:
    name: WorkerNodePostKubeadmCommands
    description: "Add kubeadm post commands"
    enabledIf: "{{ if .workerNodeConfig.postInitCommands }}true{{ end }}"
    definitions:
      - selector:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          matchResources:
            machineDeploymentClass:
              names:
              - proxmox-worker
        jsonPatches:
          - op: add
            path: /spec/template/spec/postKubeadmCommands
            valueFrom:
              variable: workerNodeConfig.postInitCommands
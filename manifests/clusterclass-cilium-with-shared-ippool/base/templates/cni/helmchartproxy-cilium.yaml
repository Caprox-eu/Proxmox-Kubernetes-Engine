apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  name: cilium
spec:
  clusterSelector:
    matchLabels:
      caprox.eu/cni: cilium
  releaseName: cilium
  version: 1.19.3
  repoURL: https://helm.cilium.io/
  chartName: cilium
  namespace: kube-system
  valuesTemplate: |
    {{- $customValues := "" -}}
    {{- range .Cluster.spec.topology.variables -}}
      {{- if eq .name "ciliumHelmValues" -}}
        {{- $customValues = .value -}}
      {{- end -}}
    {{- end -}}
    {{ $customValues }}